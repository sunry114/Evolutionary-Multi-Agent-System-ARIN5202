name: Linux verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  interfaces:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e .
      - name: Compile and run offline tests, including POSIX credential checks
        run: |
          python -m compileall -q src tests
          python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Check CLI and tracked secret patterns
        run: |
          evo-v3 --version
          python -m evo --help
          python scripts/check_secrets.py
      - name: Verify installable wheel includes Web assets
        run: |
          python -m pip wheel . --no-deps --wheel-dir /tmp/evo-wheels
          python -m pip install --target /tmp/evo-installed /tmp/evo-wheels/*.whl
          cd /tmp
          PYTHONPATH=/tmp/evo-installed python -c "from importlib.resources import files; assert '协作工作台' in files('evo.interfaces.web').joinpath('assets/index.html').read_text(encoding='utf-8')"
