<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="__TOKEN__">
  <title>Evo · 工单协作工作台</title>
  <style nonce="__TOKEN__">__STYLES__</style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#issues"><span class="brand-mark">E</span><span>Evo<small>协作工作台</small></span></a>
      <nav aria-label="主导航" class="nav">
        <a href="#issues" data-route="issues"><span aria-hidden="true">▤</span>工单列表</a>
        <a href="#attention" data-route="attention"><span aria-hidden="true">◷</span>待我处理</a>
        <a href="#workspace" data-route="workspace"><span aria-hidden="true">⚙</span>工作区</a>
      </nav>
      <div class="sidebar-owners">
        <h2>按负责人查看</h2>
        <nav id="owner-nav" class="nav" aria-label="负责人"></nav>
      </div>
      <div class="workspace-indicator" id="notice">正在连接</div>
    </aside>

    <main tabindex="-1">
      <header class="topbar">
        <div class="crumb" id="breadcrumb"><span>工作台</span><span aria-hidden="true">/</span><strong>工单</strong></div>
        <div class="top-actions">
          <button class="button quiet" id="refresh" type="button">刷新</button>
          <button class="button primary" id="new-issue" type="button"><span aria-hidden="true">＋</span> 新建工单</button>
        </div>
      </header>
      <p id="status" class="notice" role="status" aria-live="polite" hidden></p>
      <section id="list-view" class="view" aria-labelledby="list-title">
        <div class="page-heading">
          <h1 id="list-title">工单</h1>
          <span id="issue-count" class="count"></span>
        </div>
        <div class="list-controls">
          <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索标题或工单 ID" aria-label="搜索工单"></label>
          <label class="select-control">负责人 <select id="owner-filter"><option value="">全部</option></select></label>
          <label class="select-control">状态 <select id="status-filter" aria-label="按状态筛选"><option value="">全部</option></select></label>
        </div>
        <div id="issue-list" class="issue-list" aria-live="polite"></div>
      </section>

      <section id="detail-view" class="view" hidden aria-label="工单详情">
        <div id="issue-heading" class="issue-heading"></div>
        <div class="detail-grid">
          <div class="activity card">
            <nav id="issue-tabs" class="tabs" aria-label="工单内容"></nav>
            <div id="issue-panel" class="panel" aria-live="polite"></div>
          </div>
          <aside id="inspector" class="inspector" aria-label="工单属性"></aside>
        </div>
      </section>

      <section id="workspace-view" class="view" hidden aria-labelledby="workspace-title">
        <div class="page-heading"><h1 id="workspace-title">工作区</h1></div>
        <div class="settings-grid">
          <details class="card setting">
            <summary>配置成员和 Squad</summary>
            <form id="configure-form" class="stack">
              <label>工作区配置（JSON）<textarea name="registry" rows="9" required spellcheck="false"></textarea></label>
              <button class="button primary" type="submit">保存配置</button>
            </form>
          </details>
          <details class="card setting">
            <summary>工作区群聊</summary>
            <form id="group-form" class="stack">
              <label>群聊消息<textarea name="message" rows="2" required maxlength="8000"></textarea></label>
              <button class="button" type="submit">发送群聊</button>
            </form>
            <div id="group-list" class="workspace-messages"></div>
          </details>
          <details class="card setting">
            <summary>成员私聊</summary>
            <form id="dm-form" class="stack">
              <label>私聊成员<select name="agent" required></select></label>
              <label>私聊消息<textarea name="message" rows="2" required maxlength="8000"></textarea></label>
              <button class="button" type="submit">发送私聊</button>
            </form>
            <div id="dm-list" class="workspace-messages"></div>
          </details>
          <details class="card setting">
            <summary>成员私有记忆</summary>
            <form id="memory-form" class="stack">
              <label>记忆归属<select name="agent" required></select></label>
              <label>检索词<input name="query"></label>
              <button class="button" type="submit">查询记忆</button>
            </form>
            <pre id="memory-result" class="output" hidden></pre>
          </details>
          <details class="card setting">
            <summary>JSONL 评测</summary>
            <form id="eval-form" class="stack">
              <label>本地 JSONL 路径<input name="dataset" required></label>
              <label>报告路径<input name="output" required></label>
              <label>记忆策略<select name="memory">
                <option value="compare">对比开启和关闭</option><option value="on">开启</option><option value="off">关闭</option>
              </select></label>
              <button class="button" type="submit">运行评测</button>
            </form>
            <pre id="eval-result" class="output" hidden></pre>
          </details>
        </div>
      </section>
    </main>
  </div>

  <dialog id="create-dialog" aria-labelledby="create-title">
    <form id="create-form" class="stack">
      <div class="dialog-header"><h2 id="create-title">新建工单</h2><button id="close-create" class="button quiet" type="button" aria-label="关闭新建窗口">×</button></div>
      <label>目标与要求<textarea name="prompt" required rows="4" placeholder="描述要完成的工作和交付要求"></textarea></label>
      <div class="field-grid">
        <label>验收文件<input name="expected_path" placeholder="report.md"></label>
        <label>文件应包含<input name="expected_text" placeholder="预期内容"></label>
      </div>
      <label class="check"><input type="checkbox" name="from_group">关联工作区待归档的群聊</label>
      <label class="check"><input type="checkbox" name="no_memory">关闭本工单的个人记忆</label>
      <p id="create-error" class="form-error" role="alert" hidden></p>
      <div class="form-actions"><button class="button primary" type="submit">创建工单</button></div>
    </form>
  </dialog>
  <script nonce="__TOKEN__">__SCRIPT__</script>
</body>
</html>
